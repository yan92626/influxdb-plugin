name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and project versions
        run: npm run version:check -- "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run typecheck
      - run: npm run package
      - name: Extract release notes
        run: npm run release:notes -- "${GITHUB_REF_NAME}" release/RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/influxdb3-head-${GITHUB_REF_NAME}.zip
          release/influxdb3-head-${GITHUB_REF_NAME}.zip.sha256
          --verify-tag
          --title "InfluxDB3 Head ${GITHUB_REF_NAME}"
          --notes-file release/RELEASE_NOTES.md
